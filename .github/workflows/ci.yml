name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RestaurantOS.slnx
      - name: Build
        run: dotnet build RestaurantOS.slnx --no-restore -c Release
      - name: Test
        run: dotnet test apps/api/tests/RestaurantOS.Api.Tests/RestaurantOS.Api.Tests.csproj -c Release --verbosity minimal
        env:
          ManagementAuth__SigningKey: "ci-test-signing-key-at-least-32-bytes-long!!"
      - name: Validate stock photos
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/validate-stock-photos.ps1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build MVC site
        run: dotnet build apps/web/RestaurantOS.Web/RestaurantOS.Web.csproj -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test customer-web
        run: pnpm web:test
      - name: Test restaurant-web
        run: pnpm restaurant:test
      - name: Build customer-web
        run: pnpm web:build
      - name: Build restaurant-web
        run: pnpm restaurant:build
