name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RestaurantOS.slnx
      - name: Build
        run: dotnet build RestaurantOS.slnx --no-restore -c Release
      - name: Test
        run: dotnet test apps/api/tests/RestaurantOS.Api.Tests/RestaurantOS.Api.Tests.csproj -c Release --verbosity minimal
        env:
          ManagementAuth__SigningKey: "ci-test-signing-key-at-least-32-bytes-long!!"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build MVC site
        run: dotnet build apps/web/RestaurantOS.Web/RestaurantOS.Web.csproj -c Release
