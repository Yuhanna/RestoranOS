<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f0" />
    <meta name="description" content="Pasa — masadan mutfağa restoran işletim sistemi" />
    <link rel="icon" type="image/svg+xml" href="/pasa-mark.svg" />
    <link rel="apple-touch-icon" href="/pasa-mark.png" />
    <title>Pasa · Masa Menüsü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Nunito:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <main
        id="boot-fallback"
        style="
          min-height: 100dvh;
          margin: 0;
          padding: 2rem 1.5rem;
          display: flex;
          flex-direction: column;
          justify-content: center;
          font-family: system-ui, sans-serif;
          background: #f8f5ef;
          color: #21170f;
        "
      >
        <p style="margin: 0 0 0.5rem; color: #a8461e; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">
          Pasa
        </p>
        <h1 id="boot-fallback-title" style="margin: 0; font-size: 1.75rem; line-height: 1.2">Menü yükleniyor…</h1>
        <p id="boot-fallback-body" style="margin: 1rem 0 0; color: #74675d; line-height: 1.6">
          Bu ekran birkaç saniyeden uzun sürerse Wi‑Fi bağlantınızı kontrol edin ve sayfayı yenileyin.
        </p>
        <p id="boot-fallback-actions" style="margin: 1.25rem 0 0; display: none;">
          <button
            type="button"
            onclick="location.reload()"
            style="min-height: 2.75rem; padding: 0.75rem 1.25rem; border: 0; border-radius: 0.625rem; background: #a8461e; color: #fff; font-weight: 700;"
          >
            Tekrar dene
          </button>
        </p>
      </main>
    </div>
    <script>
      (function () {
        setTimeout(function () {
          var fallback = document.getElementById("boot-fallback");
          if (!fallback) return;
          var title = document.getElementById("boot-fallback-title");
          var body = document.getElementById("boot-fallback-body");
          var actions = document.getElementById("boot-fallback-actions");
          if (title) title.textContent = "Menü açılamadı";
          if (body) {
            body.textContent =
              "Uygulama yüklenemedi. Bilgisayarda customer-web (5173) ve API (5183) çalışıyor olmalı; telefon aynı Wi‑Fi ağında olmalı. QR kodunu yönetim panelinden yeniden üretip tekrar deneyin.";
          }
          if (actions) actions.style.display = "block";
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
